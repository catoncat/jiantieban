name: macOS verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Core and platform tests
        run: make test
      - name: Release bundle (no distribution signing)
        run: make bundle
      - name: Headless CLI failure contracts
        run: python3 Scripts/test-headless-cli.py
